id: melanoma
version: 0.2.0
status: draft
name: Melanoma
short_name: Melanoma
tissue: skin
data_richness: medium
color: "#B08BBB"
description: >
  Melanoma spatial atlas. Covers tumor, invasive margin, immune infiltrate,
  stroma and necrosis, with skin compartments.
aliases: [SKCM, cutaneous melanoma]
reference:
  scrna_sources:
    - Human Cell Atlas skin
    - Melanoma scRNA-seq atlases
    - TCGA-SKCM derived signatures
  spatial_sources:
    - HTAN melanoma atlas
    - GEO Visium melanoma studies
  minimum_samples: 3
cell_types:
  - id: melanocyte
    name: Melanocyte
    markers: [MLANA, PMEL, TYR, MITF, DCT]
    color: "#8E7CC3"
  - id: tumor
    name: Melanoma tumor
    markers: [SOX10, S100B, MITF, MLANA]
    color: "#6B4C8A"
  - id: keratinocyte
    name: Keratinocyte
    markers: [KRT5, KRT14, KRT1, KRT10]
    color: "#E8B4B8"
  - id: fibroblast
    name: Fibroblast / CAF
    markers: [COL1A1, COL1A2, DCN, PDGFRB]
    color: "#C8B08A"
  - id: endothelial
    name: Endothelial
    markers: [PECAM1, VWF, CDH5]
    color: "#D96C5F"
  - id: t_cell
    name: T cell
    markers: [CD3D, CD3E, CD2, CD8A, TRAC]
    color: "#6FA8DC"
  - id: b_cell
    name: B cell
    markers: [CD79A, MS4A1, CD19, IGHM]
    color: "#B7A6D9"
  - id: macrophage
    name: Macrophage
    markers: [CD68, CD163, CSF1R, C1QA]
    color: "#E6A96B"
zones:
  - id: tumor
    name: Tumor
    markers: [SOX10, MLANA, MITF]
    color: "#FF6B6B"
    description: Melanoma tumor compartment.
  - id: invasive_margin
    name: Invasive margin
    markers: [SOX10, COL1A1, CD3D]
    color: "#FF9F43"
    description: Tumor-stroma interface with immune infiltrate.
  - id: immune
    name: Immune infiltrate
    markers: [CD3D, CD8A, CD68]
    color: "#6FA8DC"
    description: Immune-rich region.
  - id: stroma
    name: Stroma
    markers: [COL1A1, DCN, PDGFRB]
    color: "#C8B08A"
    description: Fibrous stroma.
  - id: necrosis
    name: Necrosis / hypoxia
    markers: [VEGFA, CA9, SLC2A1]
    color: "#5C5C5C"
    description: Hypoxic / necrotic region.
targets:
  - gene: BRAF
    name: BRAF
    rationale: V600E/K targeted therapy.
    evidence_level: established
  - gene: NRAS
    name: NRAS
    rationale: MAPK pathway.
    evidence_level: established
  - gene: KIT
    name: KIT
    rationale: Mucosal/acral subset.
    evidence_level: emerging
  - gene: CD274
    name: PD-L1
    rationale: Immunotherapy context.
    evidence_level: established
  - gene: CTLA4
    name: CTLA-4
    rationale: Immune checkpoint context.
    evidence_level: established
  - gene: VEGFA
    name: VEGF-A
    rationale: Angiogenesis target.
    evidence_level: emerging
ligand_receptor_pairs:
  - { ligand: CD274, receptor: PDCD1, sender: tumor, receiver: t_cell, category: "immune checkpoint" }
  - { ligand: VEGFA, receptor: KDR, sender: tumor, receiver: endothelial, category: "angiogenesis" }
  - { ligand: SPP1, receptor: CD44, sender: macrophage, receiver: tumor, category: "myeloid–tumor" }
  - { ligand: CXCL12, receptor: CXCR4, sender: fibroblast, receiver: tumor, category: "chemokine" }
  - { ligand: TGFB1, receptor: TGFBR2, sender: tumor, receiver: fibroblast, category: "stromal activation" }
  - { ligand: CSF1, receptor: CSF1R, sender: tumor, receiver: macrophage, category: "myeloid recruitment" }
  - { ligand: CXCL9, receptor: CXCR3, sender: macrophage, receiver: t_cell, category: "T-cell recruitment" }
  - { ligand: CXCL13, receptor: CXCR5, sender: t_cell, receiver: b_cell, category: "lymphoid aggregate" }
not_assessed:
  - "BRAF V600 mutation status"
  - "Breslow thickness, ulceration, or stage"
  - "Patient prognosis or treatment response"
report:
  title: Melanoma Spatial Atlas
  sections: [summary, qc, composition, domains, targets, limitations]
validation:
  metrics: {}
  last_run: null
  approved_by: null
