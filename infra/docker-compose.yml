# Topiome on one machine: PostgreSQL + API + worker + web.
#   cp infra/.env.production.example infra/.env.production   # then fill in secrets
#   docker compose -f infra/docker-compose.yml --env-file infra/.env.production up -d --build
name: topiome

x-api-env: &api-env
  APP_ENV: production
  APP_URL: ${APP_URL:?set APP_URL}
  CORS_ORIGINS: ${APP_URL}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  DATABASE_URL: postgresql+psycopg://topiome:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/topiome
  STORAGE_DIR: /data/storage
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-eu-central-1}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_PRESIGN_SECONDS: ${S3_PRESIGN_SECONDS:-900}
  QUEUE_MODE: worker
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
  RUN_MAX_ATTEMPTS: ${RUN_MAX_ATTEMPTS:-3}
  RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-30}
  RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
  REDIS_URL: ${REDIS_URL:-redis://localhost:6379/0}
  REGISTER_ATTEMPTS_PER_HOUR: ${REGISTER_ATTEMPTS_PER_HOUR:-5}
  UPLOAD_ATTEMPTS_PER_HOUR: ${UPLOAD_ATTEMPTS_PER_HOUR:-20}
  INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-72}
  BREACH_CHECK_ENABLED: ${BREACH_CHECK_ENABLED:-true}
  MFA_ISSUER: ${MFA_ISSUER:-Topiome}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-hello@topiome.com}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_LAB: ${STRIPE_PRICE_LAB:-}
  STRIPE_PRICE_INSTITUTION: ${STRIPE_PRICE_INSTITUTION:-}
  ALLOW_DEMO_LOGIN: ${ALLOW_DEMO_LOGIN:-false}
  AUTO_SEED: ${AUTO_SEED:-false}
  TOPIOME_GIT_COMMIT: ${TOPIOME_GIT_COMMIT:-unversioned}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: topiome
      POSTGRES_DB: topiome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topiome -d topiome"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment: *api-env
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    volumes:
      - storage:/data/storage
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy  # migrations have run

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_URL: http://api:8000
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  storage:
