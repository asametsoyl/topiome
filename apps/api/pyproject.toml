[project]
name = "topiome-api"
version = "0.1.0"
description = "Topiome API — spatial disease atlas platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "jinja2>=3.1",
  "jsonschema>=4.23",
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=18",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "pyotp>=2.9",
  "qrcode>=8.0",
  "boto3>=1.35",
  "redis>=5.2",
  "topiome-analysis",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.uv.sources]
topiome-analysis = { path = "../../packages/analysis", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# macOS AppleDouble files on the exFAT disk
extend-exclude = ["**/._*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
